name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Gate on runtime dependencies; dev-only tooling advisories are reported but don't block.
    - name: Security Audit
      run: npm audit --omit=dev --audit-level=high

    - name: Security Audit (dev dependencies, informational)
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Run Linting
      run: npm run lint

    - name: Run Tests
      run: npm test

    - name: Build
      run: npm run build
